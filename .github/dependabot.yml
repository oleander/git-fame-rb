# Dependabot version updates. Each ecosystem opens one grouped pull request
# per week instead of one pull request per dependency.
# Options: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    versioning-strategy: increase
    schedule:
      interval: weekly
    groups:
      bundler:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
